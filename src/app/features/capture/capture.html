<video #video class="capture__video" autoplay playsinline muted></video>

@switch (state()) {
  @case ('denied') {
    <cam-camera-blocked reason="denied" (retry)="onRetryClick()" />
  }
  @case ('insecure') {
    <cam-camera-blocked reason="insecure" (retry)="onRetryClick()" />
  }
  @case ('unavailable') {
    <cam-camera-blocked reason="unavailable" (retry)="onRetryClick()" />
  }
  @case ('running') {
    @if (gridOn()) {
      <div class="capture__grid"></div>
    }
    <div class="capture__top">
      @if (torchAvailable()) {
        <button
          type="button"
          class="icon-btn icon-btn--ghost"
          [class.icon-btn--on]="torchOn()"
          aria-label="Taschenlampe"
          (click)="onTorchClick()"
        >
          <cam-icon name="flash" />
        </button>
      } @else {
        <span></span>
      }
      <button
        type="button"
        class="icon-btn icon-btn--ghost"
        [class.icon-btn--on]="gridOn()"
        aria-label="Raster"
        (click)="onGridClick()"
      >
        <cam-icon name="grid" />
      </button>
    </div>
    <p class="capture__hint">Dokument formatfüllend ins Bild halten</p>
    <div class="capture__bottom">
      <span></span>
      <button
        type="button"
        class="capture__shutter"
        [disabled]="capturing()"
        (click)="onShutterClick()"
        aria-label="Foto aufnehmen"
      ></button>
      <span></span>
    </div>
  }
}
